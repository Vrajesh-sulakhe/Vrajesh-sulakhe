name: Generate Contribution Snake

on:
  schedule:
    - cron: "15 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/snake.yml"

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate contribution snake SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution snake (light & dark)
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Checkout output branch
        id: checkout_output
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: output
          path: _output

      - name: Initialize workspace if output branch missing
        if: steps.checkout_output.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _output

      - name: Publish snake SVGs to output branch
        run: |
          cd _output
          if ! git rev-parse --verify origin/output >/dev/null 2>&1; then
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi
          touch .nojekyll
          cp ../dist/github-snake.svg ./github-snake.svg
          cp ../dist/github-snake-dark.svg ./github-snake-dark.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll github-snake.svg github-snake-dark.svg
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore(profile): update contribution snake SVGs"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:output; then
              exit 0
            fi
            git fetch origin output && git rebase origin/output
            sleep 2
          done
          exit 1

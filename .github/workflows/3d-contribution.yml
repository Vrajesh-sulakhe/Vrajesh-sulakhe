name: Generate 3D Contribution Graph

on:
  schedule:
    - cron: "15 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/3d-contribution.yml"

permissions:
  contents: write

concurrency:
  group: 3d-contribution-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    name: Generate 3D contribution SVGs
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate 3D contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Checkout output branch
        id: checkout_output
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true
        with:
          ref: output
          path: _output

      - name: Initialize workspace if output branch missing
        if: steps.checkout_output.outcome != 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: _output

      - name: Publish 3D contribution SVGs to output branch
        run: |
          cd _output
          if ! git rev-parse --verify origin/output >/dev/null 2>&1; then
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
          fi
          touch .nojekyll
          mkdir -p 3d-contrib
          cp ../profile-3d-contrib/profile-night-rainbow.svg 3d-contrib/profile-night-rainbow.svg
          cp ../profile-3d-contrib/profile-green-animate.svg 3d-contrib/profile-green-animate.svg
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .nojekyll 3d-contrib/profile-night-rainbow.svg 3d-contrib/profile-green-animate.svg
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "chore(profile): update 3D contribution SVGs"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:output; then
              exit 0
            fi
            git fetch origin output && git rebase origin/output
            sleep 2
          done
          exit 1

    <style>
@font-face {
  font-family: 'Fira Code';
  font-style: normal;
  font-weight: 600;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>
    <defs>
        <linearGradient id='red-grad' gradientUnits='userSpaceOnUse' x1='80' y1='0' x2='740' y2='0'>
